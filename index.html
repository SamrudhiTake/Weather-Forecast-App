<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel = "stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    </head>
<body>
    <div class="weatherapp">
        <header class="input-container">
            <input class="city-input" type="text" placeholder="Search City">
            <button class="search-btn">
                <span class="material-symbols-outlined">
search
</span>
            </button>
        </header>
        <section class="weather-info">
            <div class="location-date">
                <div class="location">
                  <span class="material-symbols-outlined">
location_on
</span>
                    <h2 class="country-txt">India</h2>
                </div>
                <div class="current-date-txt">Thu, 12 Feb</div>
            </div>

            <div class="weather-summary-container">
                <img src="assets/clouds.svg" class="weather-summary-image">
                <div class="weather-summary-info">
                <h1 class="temp-txt">25°C</h1>
                <h3 class="condition-txt">clouds</h3>
                </div>
            </div>

            <div class="weather-conditions-container">
                <div class="condition-item">
                    <span class="material-symbols-outlined">
                        water_drop
                    </span>
                    <div class="condition-info">
                        <h5 class="regular-txt">Humidity</h5>
                        <h5 class="humidity-value-txt">55%</h5>
                    </div>
                </div>
                <div class="condition-item">
                    <span class="material-symbols-outlined">
                        air
                    </span>
                    <div class="condition-info">
                        <h5 class="regular-txt">wind speed</h5>
                        <h5 class="wind-value-txt">2 M/s</h5>
                    </div>
                </div>
            </div>

            <div class="forecast-items-container">
                <div class="forecast-item">
                    <h5 class="forecast-item-date">10 Feb</h5>
                    <img src= "assets/thunderstorm.svg" class="forecast-item-image">
                    <h5 class="forecast-item-temp">25°C</h5>
                </div>
                  <div class="forecast-item">
                    <h5 class="forecast-item-date">10 Feb</h5>
                    <img src= "assets/thunderstorm.svg" class="forecast-item-image">
                    <h5 class="forecast-item-temp">25°C</h5>
                </div>
                  <div class="forecast-item">
                    <h5 class="forecast-item-date">10 Feb</h5>
                    <img src= "assets/thunderstorm.svg" class="forecast-item-image">
                    <h5 class="forecast-item-temp">25°C</h5>
                </div>
                  <div class="forecast-item">
                    <h5 class="forecast-item-date">10 Feb</h5>
                    <img src= "assets/thunderstorm.svg" class="forecast-item-image">
                    <h5 class="forecast-item-temp">25°C</h5>
                </div>

            </div>
        </section>

        <section class="not-found" style="display:none;">
            <div>
                <h1>404 Error City Not Found</h1>
            </div>
        
        </section>

        <section class="search-city"></section>
    </div>
    <!--script src="script.js"></script-->
</body>
</html>
